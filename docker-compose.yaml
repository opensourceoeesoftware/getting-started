services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: ${OEE_DB_NAME}
      POSTGRES_USER: ${OEE_DB_USER}
      POSTGRES_PASSWORD: ${OEE_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: opensourceoeesoftware/opensource-oee-cmms:backend-v1
    restart: always
    environment:
      OEE_DB_HOST: db
    env_file: ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static:/app/staticapi
      - media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/admin || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: opensourceoeesoftware/opensource-oee-cmms:frontend-1.0.0
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - static:/backend/staticapi
      - media:/backend/media

volumes:
  pgdata:
  static:
  media:
